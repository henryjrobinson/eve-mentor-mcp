<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>EVE Mentor — login callback</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; background: #060913; color: #cbd5e1; }
  main { max-width: 42rem; margin: 0 auto; padding: 6rem 1.25rem; line-height: 1.65; }
  h1 { color: #f8fafc; font-size: 1.5rem; }
  a { color: #e4a853; }
</style>
</head>
<body>
<main>
  <h1>Logged in — returning you to EVE Mentor…</h1>
  <p>This page forwards your EVE login back to the EVE Mentor server running on your machine.
  If nothing happens within a few seconds, make sure you started the login from Claude (the
  local server only listens during an active login), then <a id="retry" href="http://localhost:8484/callback">click here to retry</a>.</p>
</main>
<script>
  var target = "http://localhost:8484/callback" + window.location.search;
  document.getElementById("retry").href = target;
  window.location.replace(target);
</script>
</body>
</html>
